<style>
  :root{

    padding:10px 14px;margin:0 0 12px;border-radius:0 6px 6px 0;}
  #stream .kw-block .w{color:var(--accent);font-size:12px;opacity:.85;margin-bottom:2px;}
  #stream .nudge{color:var(--dim);font-size:13px;font-style:italic;margin:10px 0 14px;}
  #stream .miss{color:#c98f7a;font-size:14px;margin:0 0 12px;}
  #stream .theend{color:var(--accent2);text-align:center;margin:28px 0 6px;letter-spacing:4px;font-size:16px;}
  #input-zone{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);
    padding:22px 0 18px;}
  #inner{max-width:780px;margin:0 auto;padding:0 22px;}
  #bar{display:flex;gap:8px;}
  #input{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--ink);
    padding:12px 14px;font-size:15px;border-radius:8px;outline:none;font-family:inherit;}
  #input:focus{border-color:var(--accent);}
  #hint{color:var(--dim);font-size:12px;margin-top:8px;}
  #chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .chip{background:var(--panel);border:1px solid var(--line);color:var(--ink);

  .chip:hover{border-color:var(--accent);color:var(--accent);}
  .chip.done{opacity:.35;text-decoration:line-through;cursor:default;}
  details.dev{margin-top:26px;font-size:12px;color:var(--dim);}

  #devlog{width:100%;background:#0a0d12;border:1px solid var(--line);color:#9fd6a0;

  .devrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
  .devrow button{background:var(--panel);border:1px solid var(--line);color:var(--ink);

      {k:"猎字",   w:["猎字","笔迹","字","那个字"], dim:"S", t:"“猎”字写在左手掌心，记号笔，黑色。起笔重、收尾稳、没有颤抖——写这个字的人情绪激烈但完全可控。字的右下方有一道极细的拖尾，方向向左下，像是笔尖离开掌面时被什么阻了一下。"},

/* ============================================================
   工具
   ============================================================ */
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function rich(s){
  s = esc(s);
  s = s.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
  s = s.replace(/\*(.+?)\*/g, "<i>$1</i>");
  return s;
}
function nowISO(){ return new Date().toISOString(); }
function sceneEntryDur(){
  const d = Math.round((Date.now() - state.sceneEntry) / 1000);
  state.sceneEntry = Date.now();
  return d;
}
function sceneDef(n){ return SCENES[n]; }

/* ============================================================
   词库匹配（先精确，后子串；分叉/触发词只走精确）
   ============================================================ */
function findMatch(raw, sceneNum){
  const kws = SCENES[sceneNum].keywords;
  const norm = raw.trim();
  if(!norm) return null;
  let hit = null;
  for(const kw of kws){
    if(kw.w.some(v => v === norm)){ hit = kw; break; }
  }
  if(hit) return hit;
  if(norm.length >= 2){
    for(const kw of kws){
      if(kw.dim === "FORK" || kw.dim === "TRIGGER" || kw.dim === "HOT") continue;
      if(kw.w.some(v => v.length >= 2 && v.indexOf(norm) !== -1)){ hit = kw; break; }
    }
  }
  return hit;
}

/* ============================================================
   行为日志
   ============================================================ */
function pushLog(entry){
  state.seq++;
  entry.sequence = state.seq;
  entry.session_id = SESSION;
  entry.timestamp = nowISO();
  state.log.push(entry);
  renderDev();
  submitEntry(entry);
}

function recordInput(raw, matchedKey, sceneNum, forkChoice, forkTyped){
  pushLog({
    scene: sceneNum,
    input_word: raw,
    matched_key: matchedKey || null,
    scene_duration: sceneEntryDur(),
    skipped: false,
    hidden_choice: forkChoice || "",
    fork_typed: forkTyped || ""
  });
}

function recordSkip(raw, sceneNum){
  pushLog({
    scene: sceneNum,
    input_word: raw,
    matched_key: "SKIP",
    scene_duration: sceneEntryDur(),
    skipped: true,
    hidden_choice: ""
  });
}

function renderProfile(){
  const el = document.getElementById("profile");
  const hidden = state.hidden;
  const count = arr => arr.reduce((o,c)=>{o[c]= (o[c]||0)+1; return o;},{});
  const c = count(hidden.map(h=>h.choice));
  const perception = {S:0, N:0};
  state.log.forEach(e=>{
    if(e.skipped || !e.matched_key) return;
    const kw = findKeyByName(e.matched_key, e.scene);
    if(!kw || kw.dim==="FORK" || kw.dim==="TRIGGER" || kw.dim==="HOT") return;
    if(kw.dim.indexOf("S")!==-1) perception.S++;
    if(kw.dim.indexOf("N")!==-1) perception.N++;
  });
  const pick = (a,b)=> (c[a]||0) > (c[b]||0) ? a+"·"+b : (c[b]||0) > (c[a]||0) ? b+"·"+a : (a+"·"+b)+"(平)";
  const parts = [];
  if(c.E||c.I) parts.push("行动 E/I："+pick("E","I"));
  if(c.T||c.F) parts.push("干预 T/F："+pick("T","F"));
  if(c.J||c.P) parts.push("收束 J/P："+pick("J","P"));
  parts.push("感知 S/N："+perception.S+" : "+perception.N);
  el.innerHTML = parts.length
    ? parts.map(p=>`<div><b>${p}</b></div>`).join("")
    : "<div style='color:var(--dim)'>尚未采集到足量数据。</div>";
}
function findKeyByName(name, sceneNum){
  return SCENES[sceneNum] && SCENES[sceneNum].keywords.find(k=>k.k===name) || null;
}

/* ============================================================
   主交互
   ============================================================ */
function handleInput(raw){
  const word = raw.trim();
  if(!word || state.finished) return;

  if(ADVANCE_CMDS.indexOf(word) !== -1){
    recordSkip(word, state.scene);
    advanceScene();
    return;
  }

  const sceneNum = state.scene;
  const kw = findMatch(word, sceneNum);

  if(!kw){
    recordInput(word, null, sceneNum, "");
    const explored = state.explored[sceneNum] || new Set();
    const sugg = sceneDef(sceneNum).keywords.filter(k=>!explored.has(k.k) && k.dim!=="TRIGGER").map(k=>k.w[0]).slice(0,4);
    appendMiss(word, sugg);
    renderChips();
    return;
  }

  const explored = state.explored[sceneNum] || (state.explored[sceneNum]=new Set());
  explored.add(kw.k);

  let fork = "", forkTyped = "";
  if(kw.dim === "FORK"){
    forkTyped = kw.fork;
    const pair = PAIR_OF[kw.fork];
    if(!state.forkPairs.includes(pair)){
      state.forkPairs.push(pair);
      fork = kw.fork; // 首条决策才计分
      state.hidden.push({choice:fork, input_word:word, scene:sceneNum, key:kw.k, ts:nowISO()});
    }
  }

  recordInput(word, kw.k, sceneNum, fork, forkTyped);
  appendKw(kw, word);

  if(kw.dim === "TRIGGER" && kw.to){
    setTimeout(()=>advanceScene(kw.to), 600);
    return;
  }
  renderChips();

  const scene = sceneDef(sceneNum);
  if(explored.size >= scene.threshold && !state.sceneNudged){
    state.sceneNudged = true;
    appendNudge(sceneNum);
  }
}

function advanceScene(to){
  const next = to || (state.scene + 1);
  sceneEntryDur();
  state.sceneNudged = false;
  if(next > 5){
    state.finished = true;
    appendTheEnd();
    persist();
    renderChips();
    submitFinish();
    return;
  }
  state.scene = next;
  appendScene(next);
  renderSceneTrack();
  renderChips();
  persist();
  scrollToBottom();
}

/* ============================================================
   持久化 / 导出 / 重置
   ============================================================ */
function persist(){
  try{
    const explored = {};
    Object.keys(state.explored).forEach(s=>explored[s]=[...state.explored[s]]);
    localStorage.setItem(LSKEY, JSON.stringify({
      session:SESSION, scene:state.scene, seq:state.seq, finished:state.finished,
      explored, log:state.log, hidden:state.hidden, forkPairs:state.forkPairs, stream:stream.innerHTML
    }));
  }catch(e){}
}
function tryRestore(){
  let saved=null;
  try{ saved = JSON.parse(localStorage.getItem(LSKEY)||"null"); }catch(e){}
  if(saved && saved.session === SESSION){ /* 同页刷新才恢复 */ }
  if(saved && saved.stream && confirm("检测到上次未完成的进度，是否继续？")){
    state.scene=saved.scene; state.seq=saved.seq; state.finished=saved.finished;
    state.log=saved.log||[]; state.hidden=saved.hidden||[]; state.forkPairs=saved.forkPairs||[];
    state.explored={};
    (saved.explored||{}).forEach ? Object.keys(saved.explored||{}).forEach(s=>state.explored[s]=new Set(saved.explored[s])) : 0;
    stream.innerHTML = saved.stream;
    renderSceneTrack(); renderChips(); renderDev();
    scrollToBottom();
    return true;
  }
  return false;
}
function exportLog(){
  const data = {
    session_id: SESSION,
    exported_at: nowISO(),
    log: state.log,
    hidden_forks: state.hidden,
    summary: summarize()
  };
  const blob = new Blob([JSON.stringify(data,null,2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "m16_case1_"+SESSION+".json";
  a.click();
  URL.revokeObjectURL(a.href);
}
function summarize(){
  const c = state.hidden.reduce((o,h)=>{o[h.choice]=(o[h.choice]||0)+1;return o;},{});
  return {hidden_fork_counts:c, total_inputs:state.log.length, skips:state.log.filter(e=>e.skipped).length};
}
function resetAll(){
  if(!confirm("清空当前进度并重新开始？")) return;
  localStorage.removeItem(LSKEY);
  location.reload();
}

/* ============================================================
   线上结果上报（云开发 CloudBase，队列持久化防丢）
   ============================================================ */
const PK_LS = "m16_case1_pending";
let syncQueue = [];
let syncBusy = false;
let cbApp = null, cbDb = null;

function loadCbScript(){
  return new Promise((resolve, reject)=>{
    const s = document.createElement("script");
    s.src = SDK_CDN;
    s.onload = ()=>resolve();
    s.onerror = ()=>{ console.warn("[m16] 云开发 SDK CDN 加载失败"); reject(new Error("cdn")); };
    document.head.appendChild(s);
  });
}
async function ensureCb(){
  if(cbDb) return cbDb;
  if(typeof cloudbase === "undefined"){
    try{ await loadCbScript(); }catch(e){ return null; }
  }
  if(typeof cloudbase === "undefined") return null;
  cbApp = cloudbase.init({ env: CLOUDBASE.env });
  await cbApp.auth({ persistence: "local" }).signInAnonymously()
    .catch(e=> console.warn("[m16] 匿名登录失败（请开启环境匿名登录）", e));
  cbDb = cbApp.database();
  return cbDb;
}
function saveQueue(){
  try{ localStorage.setItem(PK_LS, JSON.stringify(syncQueue)); }catch(e){}
}
function loadQueue(){
  try{
    const raw = localStorage.getItem(PK_LS);
    if(raw) syncQueue = JSON.parse(raw) || [];
  }catch(e){}
}
async function pump(){
  if(syncBusy || !hasCloudbase() || syncQueue.length === 0) return;
  syncBusy = true;
  while(syncQueue.length > 0){
    const row = syncQueue.shift();
    try{
      const db = await ensureCb();
      if(!db){ syncQueue.unshift(row); break; }
      await db.collection(CLOUDBASE.table).add(Object.assign({}, row, { _createdAt: db.serverDate() }));
      saveQueue();
    }catch(err){
      console.warn("[m16] 上报失败（稍后重试）", err);
      syncQueue.unshift(row);
      break;
    }
  }
  syncBusy = false;
  renderDev();
}
function submitEntry(entry){
  if(!hasCloudbase()) return;   // 未配置则纯本地
  let ev = entry.event_type;
  if(!ev){
    ev = entry.skipped ? "skip" : (entry.hidden_choice ? "fork" : "input");
  }
  const row = {
    session_id: entry.session_id || SESSION,
    page: CLOUDBASE.page,
    event_type: ev,
    scene: entry.scene,
    sequence: entry.sequence,
    input_word: entry.input_word,
    matched_key: entry.matched_key || null,
    scene_duration: entry.scene_duration || 0,
    skipped: !!entry.skipped,
    hidden_choice: entry.hidden_choice || "",
    fork_typed: entry.fork_typed || ""
  };
  syncQueue.push(row);
  saveQueue();
  pump();
}
function submitFinish(){
  submitEntry({event_type:"finish", scene:5, sequence:0, input_word:"__FINISH__", hidden_choice:""});
}

/* ============================================================
   启动
   ============================================================ */
function boot(){
  const input = document.getElementById("input");
  input.addEventListener("keydown", e=>{
    if(e.key === "Enter"){ handleInput(input.value); input.value=""; }
  });
  if(tryRestore()){ loadQueue(); pump(); return; }
  document.getElementById("sessionId").textContent = "session: " + SESSION;
  appendScene(1);
  renderSceneTrack();
  renderChips();
  renderDev();
  loadQueue();
  pump();
  scrollToBottom();
}
boot();
</script>
